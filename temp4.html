<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Offseason Roster — Sortable</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg0: #f0ede8;
            --bg1: #faf8f5;
            --bg2: #e8e4de;
            --bg3: #dbd6ce;
            --tx0: #1a1510;
            --tx1: #2e2820;
            --tx2: #6b6358;
            --tx3: #9c9488;
            --bdr: #cec8bf;
            --bdr2: #bab3a8;
            --blue0: #1a3a5c;
            --blue1: #2056a0;
            --blue2: #dce9f8;
            --blue3: #8ab4df;
            --green0: #1a4a1a;
            --green1: #2e7d32;
            --green2: #dff0df;
            --green3: #88c988;
            --amber0: #5a2e00;
            --amber1: #8b4a00;
            --amber2: #fdf0d8;
            --amber3: #e8a840;
            --red0: #5c1a1a;
            --red1: #a32828;
            --red2: #fde8e8;
            --red3: #e08888;
            --purple0: #3a2878;
            --purple2: #ece9ff;
            --purple3: #a89de8;
            --teal0: #0a4a38;
            --teal2: #daf5ec;
            --teal3: #5dcaa5;
            --gold: #d4930a;
            --gold2: #f7c842;
            --shadow: 0 2px 12px rgba(26, 21, 16, .1);
            --shadow2: 0 4px 24px rgba(26, 21, 16, .15);
            --radius: 12px;
            --radius-sm: 8px;
        }

        html.dark {
            --bg0: #0d0f14;
            --bg1: #13161e;
            --bg2: #1a1e28;
            --bg3: #222738;
            --tx0: #e8eaf2;
            --tx1: #c8cad8;
            --tx2: #7880a0;
            --tx3: #485070;
            --bdr: #252a38;
            --bdr2: #30374f;
            --blue0: #60a0e8;
            --blue1: #2878dd;
            --blue2: #0a1828;
            --blue3: #1a3858;
            --green0: #7adf7a;
            --green1: #4aaa4a;
            --green2: #081808;
            --green3: #183818;
            --amber0: #f8c060;
            --amber1: #c87820;
            --amber2: #1a1000;
            --amber3: #382000;
            --red0: #f08080;
            --red1: #cc3838;
            --red2: #180808;
            --red3: #380c0c;
            --purple0: #b0a8f8;
            --purple2: #0e0c1e;
            --purple3: #28236a;
            --teal0: #70ddb8;
            --teal2: #081a12;
            --teal3: #143028;
            --gold: #f8c030;
            --gold2: #ffd84a;
            --shadow: 0 2px 16px rgba(0, 0, 0, .5);
            --shadow2: 0 4px 28px rgba(0, 0, 0, .6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: 'DM Mono', monospace;
            font-size: 13px;
            color: var(--tx0);
            background: var(--bg0);
            padding: 20px;
            transition: background .3s, color .3s
        }

        .card {
            background: var(--bg1);
            border: 1px solid var(--bdr);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow)
        }

        .section-label {
            font-size: 9px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--tx3);
            margin-bottom: 8px;
            font-family: 'DM Mono', monospace
        }

        .chip {
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 20px;
            white-space: nowrap;
            flex-shrink: 0;
            border: .5px solid transparent;
            display: inline-block;
            font-family: 'DM Mono', monospace;
            font-weight: 500
        }

        .chip-green {
            background: var(--green2);
            color: var(--green0);
            border-color: var(--green3)
        }

        .chip-blue {
            background: var(--blue2);
            color: var(--blue0);
            border-color: var(--blue3)
        }

        .chip-gray {
            background: var(--bg2);
            color: var(--tx2);
            border-color: var(--bdr)
        }

        .chip-amber {
            background: var(--amber2);
            color: var(--amber0);
            border-color: var(--amber3)
        }

        .chip-red {
            background: var(--red2);
            color: var(--red0);
            border-color: var(--red3)
        }

        .chip-purple {
            background: var(--purple2);
            color: var(--purple0);
            border-color: var(--purple3)
        }

        .chip-teal {
            background: var(--teal2);
            color: var(--teal0);
            border-color: var(--teal3)
        }

        .chip-gold {
            background: linear-gradient(135deg, var(--amber2), #fff8e0);
            color: var(--amber0);
            border-color: var(--gold);
            font-weight: 700
        }

        /* ── Roster table ── */
        .roster-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            font-family: 'DM Mono', monospace
        }

        .roster-table th {
            font-size: 9px;
            font-weight: 500;
            letter-spacing: .8px;
            text-transform: uppercase;
            color: var(--tx3);
            padding: 5px 6px;
            border-bottom: 1px solid var(--bdr);
            text-align: left;
            white-space: nowrap;
            background: var(--bg2);
            user-select: none;
        }

        .roster-table th:first-child {
            border-radius: 6px 0 0 0
        }

        .roster-table th:last-child {
            border-radius: 0 6px 0 0
        }

        .roster-table th.sortable {
            cursor: default
        }

        .roster-table th .sort-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 10px;
            padding: 0 2px;
            line-height: 1;
            vertical-align: middle;
            color: var(--tx3);
            opacity: .45;
            transition: opacity .15s, color .15s;
        }

        .roster-table th .sort-btn:hover {
            opacity: .8
        }

        .roster-table th .sort-btn.active {
            color: var(--amber0);
            opacity: 1;
            font-weight: 700
        }

        .roster-table td {
            padding: 4px 6px;
            border-bottom: .5px solid var(--bdr);
            vertical-align: middle
        }

        .roster-table tr:last-child td {
            border-bottom: none
        }

        .roster-table tr:hover td {
            background: rgba(0, 0, 0, .03)
        }

        html.dark .roster-table tr:hover td {
            background: rgba(255, 255, 255, .03)
        }

        .roster-table td.num {
            color: var(--tx3);
            font-size: 10px;
            text-align: right;
            width: 22px;
            padding-right: 8px
        }

        .roster-table td.name-cell {
            font-weight: 500;
            white-space: nowrap;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .roster-table td.stat-cell {
            text-align: right;
            white-space: nowrap
        }

        /* FP row highlight */
        .roster-table tr.fp-row td {
            background: rgba(58, 40, 120, .035)
        }

        html.dark .roster-table tr.fp-row td {
            background: rgba(176, 168, 248, .055)
        }

        .roster-table tr.fp-row:hover td {
            background: rgba(58, 40, 120, .07)
        }

        html.dark .roster-table tr.fp-row:hover td {
            background: rgba(176, 168, 248, .10)
        }

        /* ── Badge grid (front office) ── */
        .badge-grid-fo {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 4px;
        }

        @media(max-width:640px) {
            .badge-grid-fo {
                grid-template-columns: repeat(3, 1fr)
            }
        }

        .badge-cell-fo {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 10px 5px 8px;
            border-radius: 12px;
            border: 1px solid var(--bdr);
            background: var(--bg1);
            cursor: default;
            transition: all .2s;
        }

        .badge-cell-fo:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow)
        }

        .badge-cell-fo:hover .badge-tip-fo {
            display: block
        }

        .badge-icon-fo {
            font-size: 22px;
            filter: grayscale(1) opacity(.22);
            transition: filter .3s, transform .3s
        }

        .badge-icon-fo.earned {
            filter: none;
            animation: foEarnedBounce .5s cubic-bezier(.34, 1.56, .64, 1)
        }

        @keyframes foEarnedBounce {
            0% {
                transform: scale(.6) rotate(-8deg)
            }

            60% {
                transform: scale(1.15) rotate(4deg)
            }

            100% {
                transform: scale(1) rotate(0)
            }
        }

        .badge-label-fo {
            font-size: 9px;
            font-weight: 500;
            color: var(--tx3);
            text-align: center;
            line-height: 1.3;
            font-family: 'DM Mono', monospace
        }

        .badge-label-fo.earned {
            color: var(--tx0)
        }

        .badge-star-fo {
            font-size: 10px;
            position: absolute;
            top: 4px;
            right: 6px;
            color: var(--gold)
        }

        .badge-tip-fo {
            display: none;
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--tx0);
            color: var(--bg1);
            font-size: 11px;
            padding: 7px 12px;
            border-radius: 8px;
            white-space: nowrap;
            z-index: 999;
            pointer-events: none;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .35);
            font-family: 'DM Mono', monospace;
        }

        /* earned glow ring */
        .badge-cell-fo.earned-cell {
            border-color: var(--amber3);
            background: linear-gradient(135deg, var(--bg1), var(--amber2))
        }

        html.dark .badge-cell-fo.earned-cell {
            background: linear-gradient(135deg, var(--bg1), var(--amber3))
        }

        /* ── Dark mode toggle ── */
        .dm-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px
        }

        .dm-toggle {
            position: relative;
            width: 40px;
            height: 22px
        }

        .dm-toggle input {
            opacity: 0;
            width: 0;
            height: 0
        }

        .dm-slider {
            position: absolute;
            inset: 0;
            cursor: pointer;
            background: rgba(0, 0, 0, .2);
            border-radius: 22px;
            transition: background .2s
        }

        .dm-slider:before {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            left: 2px;
            top: 2px;
            background: #fff;
            border-radius: 50%;
            transition: transform .25s
        }

        .dm-toggle input:checked+.dm-slider {
            background: var(--gold)
        }

        .dm-toggle input:checked+.dm-slider:before {
            transform: translateX(18px)
        }

        .dm-label {
            font-size: 10px;
            color: var(--tx2);
            letter-spacing: .5px
        }

        /* ── Page chrome ── */
        .page-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 28px;
            letter-spacing: 3px;
            color: var(--amber0);
            margin-bottom: 2px
        }

        .page-sub {
            font-size: 11px;
            color: var(--tx3);
            margin-bottom: 18px;
            font-family: 'DM Mono', monospace
        }

        .section-divider {
            margin: 14px 0 10px;
            padding-top: 10px;
            border-top: 1px solid var(--bdr)
        }

        /* ── Demo controls ── */
        .demo-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px
        }

        .demo-btn {
            padding: 5px 12px;
            border-radius: 6px;
            border: 1px solid var(--bdr2);
            background: var(--bg2);
            color: var(--tx0);
            font-size: 11px;
            cursor: pointer;
            font-family: 'DM Mono', monospace;
            transition: background .15s
        }

        .demo-btn:hover {
            background: var(--amber2);
            border-color: var(--amber3);
            color: var(--amber0)
        }

        .demo-note {
            font-size: 10px;
            color: var(--tx3);
            font-family: 'DM Mono', monospace;
            align-self: center
        }
    </style>
</head>

<body>

    <div class="dm-row">
        <span class="dm-label">DARK MODE</span>
        <label class="dm-toggle"><input type="checkbox" id="dm" onchange="toggleDark(this)"><span
                class="dm-slider"></span></label>
    </div>

    <div class="page-title">Front Office</div>
    <div class="page-sub">Click any stat header ▼ to sort · Franchise players (★FP) cannot be traded away</div>

    <!-- ── BADGES ── -->
    <div class="card">
        <div class="section-label">Front Office Achievements</div>
        <div class="badge-grid-fo" id="fo-badge-grid"></div>
    </div>

    <!-- ── DEMO BADGE AWARD CONTROLS ── -->
    <div class="demo-row">
        <span class="demo-note">Demo — award a badge:</span>
        <button class="demo-btn" onclick="awardFOBadge('bigspender')">💸 Big Spender</button>
        <button class="demo-btn" onclick="awardFOBadge('deadlinedealer')">⏰ Deadline Dealer</button>
        <button class="demo-btn" onclick="awardFOBadge('loyaltybonus')">🤝 Loyalty Bonus</button>
        <button class="demo-btn" onclick="awardFOBadge('prestige100')">🏅 Prestige 100</button>
        <button class="demo-btn" onclick="awardFOBadge('aceacquisition')">🌟 Ace Acquisition</button>
        <button class="demo-btn" onclick="resetFOBadges()" style="border-color:var(--red3);color:var(--red0)">✕
            Reset</button>
    </div>

    <!-- ── ROSTER ── -->
    <div class="card" id="offseason-roster">
        <div id="offseason-roster-hitters"></div>
        <div class="section-divider"></div>
        <div id="offseason-roster-pitchers"></div>
    </div>

    <script>
        // ══ DARK MODE ═══════════════════════════════════════════════════════════
        function toggleDark(el) { document.documentElement.classList.toggle('dark', el.checked); }

        // ══ SORT STATE ══════════════════════════════════════════════════════════
        let _rosterHitterSort = { col: null, dir: 'desc' };
        let _rosterPitcherSort = { col: null, dir: 'desc' };

        // ══ BADGE DEFINITIONS (Front Office) ════════════════════════════════════
        const FO_BADGE_DEFS = [
            {
                id: 'bigspender',
                icon: '💸',
                label: 'Big Spender',
                desc: 'Spend 80+ prestige points in a single offseason window',
                flavor: 'You opened the vault.'
            },
            {
                id: 'deadlinedealer',
                icon: '⏰',
                label: 'Deadline Dealer',
                desc: 'Make an acquisition at the trade deadline (game 100)',
                flavor: 'Beat the buzzer.'
            },
            {
                id: 'loyaltybonus',
                icon: '🤝',
                label: 'Loyalty Bonus',
                desc: 'Re-sign (re-acquire) a player you previously replaced in a prior season',
                flavor: 'Welcome back.'
            },
            {
                id: 'prestige100',
                icon: '🏅',
                label: 'Century Club',
                desc: 'Reach 100 Manager Prestige — unlocking the highest-tier teams',
                flavor: '100 points of trust earned.'
            },
            {
                id: 'aceacquisition',
                icon: '🌟',
                label: 'Ace Acquisition',
                desc: 'Sign an Ace SP (cost 45+) in the offseason window',
                flavor: 'Top of the rotation, secured.'
            },
        ];

        // Badge persistence (localStorage mock for demo)
        let _foBadges = {};
        try { _foBadges = JSON.parse(localStorage.getItem('bbm_fo_b') || '{}'); } catch { _foBadges = {}; }
        function saveFOBadges() { try { localStorage.setItem('bbm_fo_b', JSON.stringify(_foBadges)); } catch { } }

        function awardFOBadge(id) {
            if (_foBadges[id]) return false;
            _foBadges[id] = true;
            saveFOBadges();
            renderFOBadges();
            return true;
        }
        function resetFOBadges() {
            _foBadges = {};
            saveFOBadges();
            renderFOBadges();
        }

        function renderFOBadges() {
            const el = document.getElementById('fo-badge-grid');
            if (!el) return;
            let h = '';
            FO_BADGE_DEFS.forEach(b => {
                const earned = !!_foBadges[b.id];
                h += `
      <div class="badge-cell-fo${earned ? ' earned-cell' : ''}">
        <div class="badge-icon-fo${earned ? ' earned' : ''}">${b.icon}</div>
        <div class="badge-label-fo${earned ? ' earned' : ''}">${b.label}</div>
        ${earned ? '<span class="badge-star-fo">★</span>' : ''}
        <div class="badge-tip-fo">${earned ? '✓ ' : ''}${b.desc}${earned ? '<br><span style="opacity:.6;font-size:10px">' + b.flavor + '</span>' : ''}</div>
      </div>`;
            });
            el.innerHTML = h;
        }

        // ══ HELPERS ═════════════════════════════════════════════════════════════
        function spdChip(s) {
            if (s >= 80) return 'chip-green';
            if (s >= 65) return 'chip-teal';
            if (s >= 45) return 'chip-gray';
            return 'chip-amber';
        }
        const r3 = v => Math.round(v * 1000) / 1000;
        const r2 = v => Math.round(v * 100) / 100;

        // ══ MOCK ROSTER ══════════════════════════════════════════════════════════
        const POSITIONS = ['C ', '1B', '2B', '3B', 'SS', 'LF', 'CF', 'RF', 'DH'];
        function rnd(a, b) { return a + Math.random() * (b - a) }
        function rndI(a, b) { return Math.floor(rnd(a, b + 1)) }
        const NF = ['Carter', 'Eric', 'James', 'Tung', 'Mason', 'Morgan', 'Rickey', 'William', 'Davis', 'Wilson', 'Jack', 'Thompson', 'Robinson', 'Hayes', 'Parker', 'Zack', 'Drake', 'Harvey', 'Gino', 'Fred'];
        const NL = ['Smith', 'Johnson', 'Brown', 'Lee', 'Garcia', 'Rivera', 'Miller', 'Chen', 'Moore', 'Williams', 'Taylor', 'Anderson', 'Thomas', 'Torres', 'Nguyen', 'Black', 'Park', 'Kim', 'Colon', 'Patel'];
        const pick = a => a[rndI(0, a.length - 1)];

        function genHitter(i) {
            const roll = Math.random(), hand = roll < .11 ? 'S' : roll < .35 ? 'L' : 'R';
            const isFP = i === 3;
            return {
                id: i, name: pick(NF)[0] + '. ' + pick(NL),
                hand, pos: POSITIONS[i % POSITIONS.length],
                spd: rndI(15, 98),
                bbRate: r2(rnd(.07, .18)), kRate: r2(rnd(.14, .30)),
                avg: r3(rnd(.215, .325)), ops: r3(rnd(.640, .980)),
                isFP, active: true, inGame: i < 9,
                stats: { ab: 0, h: 0, bb: 0, k: 0, rbi: 0, r: 0, hr: 0, trp: 0 }
            };
        }
        function genPitcher(i) {
            const sp = i < 5, hand = Math.random() > .3 ? 'R' : 'L';
            const isFP = i === 1;
            return {
                id: i, name: pick(NF)[0] + '. ' + pick(NL),
                hand, isStarter: sp, role: sp ? 'SP' : 'RP',
                kRate: r2(rnd(sp ? .10 : .22, sp ? .24 : .30)),
                bbRate: r2(rnd(.06, .20)),
                whip: r2(rnd(sp ? .85 : 1.0, sp ? 1.85 : 1.35)),
                era: r2(rnd(sp ? 2.8 : 2.5, sp ? 6.2 : 5.8)),
                stamina: 100, maxStamina: 100,
                recoverRate: sp ? 8 : 18,
                drainPerPitch: sp ? r2(rnd(1.2, 3.8)) : r2(rnd(4.8, 6.0)),
                pitchesThisGame: 0, usedThisGame: false, active: false, currentPitcher: false,
                isFP
            };
        }

        const G = { you: { name: 'Millport Machines', hitters: [], pitchers: [] } };
        for (let i = 0; i < 13; i++) G.you.hitters.push(genHitter(i));
        for (let i = 0; i < 13; i++) G.you.pitchers.push(genPitcher(i));
        G.you.hitters[3].name = 'S. Torque';
        G.you.hitters[3].avg = .210;
        G.you.hitters[3].ops = 1.334;
        G.you.pitchers[1].name = 'D. Blaze';

        // ══ SORT HELPERS ═════════════════════════════════════════════════════════
        function setHitterSort(col) {
            if (_rosterHitterSort.col === col) {
                _rosterHitterSort.dir = _rosterHitterSort.dir === 'desc' ? 'asc' : 'desc';
            } else {
                _rosterHitterSort.col = col;
                _rosterHitterSort.dir = 'desc';
            }
            renderOffseasonRosterHitters();
        }
        function setPitcherSort(col) {
            if (_rosterPitcherSort.col === col) {
                _rosterPitcherSort.dir = _rosterPitcherSort.dir === 'desc' ? 'asc' : 'desc';
            } else {
                _rosterPitcherSort.col = col;
                _rosterPitcherSort.dir = 'desc';
            }
            renderOffseasonRosterPitchers();
        }

        function hSortIcon(col) {
            const active = _rosterHitterSort.col === col;
            const icon = (active && _rosterHitterSort.dir === 'asc') ? '▲' : '▼';
            const cls = active ? 'sort-btn active' : 'sort-btn';
            return `<button class="${cls}" onclick="setHitterSort('${col}')" title="Sort by ${col}">${icon}</button>`;
        }
        function pSortIcon(col) {
            const active = _rosterPitcherSort.col === col;
            const icon = (active && _rosterPitcherSort.dir === 'asc') ? '▲' : '▼';
            const cls = active ? 'sort-btn active' : 'sort-btn';
            return `<button class="${cls}" onclick="setPitcherSort('${col}')" title="Sort by ${col}">${icon}</button>`;
        }

        // ══ RENDER HITTERS ════════════════════════════════════════════════════════
        function renderOffseasonRosterHitters() {
            const el = document.getElementById('offseason-roster-hitters');
            if (!el) return;

            // Build display rows, preserving original index for # column
            let rows = G.you.hitters.slice(0, 13).map((h, i) => ({ ...h, _origIdx: i }));

            // Apply sort
            const { col, dir } = _rosterHitterSort;
            if (col) {
                rows.sort((a, b) => dir === 'desc' ? b[col] - a[col] : a[col] - b[col]);
            }

            let h = `<div class="section-label" style="margin-bottom:6px">Hitters</div>`;
            h += `<div style="overflow-x:auto">`;
            h += `<table class="roster-table">`;
            h += `<thead><tr>
    <th style="width:24px;text-align:right">#</th>
    <th style="min-width:32px">Pos</th>
    <th style="min-width:110px">Name</th>
    <th style="width:28px"></th>
    <th class="sortable" style="text-align:right;min-width:62px">AVG ${hSortIcon('avg')}</th>
    <th class="sortable" style="text-align:right;min-width:72px">OPS ${hSortIcon('ops')}</th>
    <th class="sortable" style="text-align:right;min-width:56px">K% ${hSortIcon('kRate')}</th>
    <th class="sortable" style="text-align:right;min-width:60px">BB% ${hSortIcon('bbRate')}</th>
    <th class="sortable" style="text-align:right;min-width:56px">Spd ${hSortIcon('spd')}</th>
    <th style="text-align:right;min-width:46px">Hand</th>
  </tr></thead>`;
            h += `<tbody>`;

            rows.forEach(p => {
                const fp = p.isFP;
                const avgChip = p.avg >= .290 ? 'chip-green' : p.avg >= .255 ? 'chip-gray' : 'chip-amber';
                const opsChip = p.ops >= .900 ? 'chip-green' : p.ops >= .720 ? 'chip-gray' : 'chip-amber';
                const kChip = p.kRate <= .15 ? 'chip-green' : p.kRate >= .25 ? 'chip-red' : 'chip-gray';
                const bbChip = p.bbRate >= .14 ? 'chip-green' : p.bbRate <= .08 ? 'chip-amber' : 'chip-gray';
                const sc = spdChip(p.spd);

                h += `<tr class="${fp ? 'fp-row' : ''}">
      <td class="num">${p._origIdx + 1}</td>
      <td><span class="chip chip-blue" style="font-size:9px">${p.pos.trim()}</span></td>
      <td class="name-cell">${fp ? `<span style="color:var(--purple0);margin-right:2px">★</span>` : ''}${p.name}</td>
      <td style="white-space:nowrap">${fp ? '<span class="chip chip-purple" style="font-size:9px">★FP</span>' : ''}</td>
      <td class="stat-cell"><span class="chip ${avgChip}" style="font-size:9px">.${Math.round(p.avg * 1000)}</span></td>
      <td class="stat-cell"><span class="chip ${opsChip}" style="font-size:9px">${p.ops.toFixed(3)}</span></td>
      <td class="stat-cell"><span class="chip ${kChip}" style="font-size:9px">${Math.round(p.kRate * 100)}%</span></td>
      <td class="stat-cell"><span class="chip ${bbChip}" style="font-size:9px">${Math.round(p.bbRate * 100)}%</span></td>
      <td class="stat-cell"><span class="chip ${sc}" style="font-size:9px">${p.spd}</span></td>
      <td style="text-align:right"><span class="chip chip-gray" style="font-size:9px">${p.hand}</span></td>
    </tr>`;
            });

            h += `</tbody></table></div>`;
            el.innerHTML = h;
        }

        // ══ RENDER PITCHERS ═══════════════════════════════════════════════════════
        function renderOffseasonRosterPitchers() {
            const el = document.getElementById('offseason-roster-pitchers');
            if (!el) return;

            let rows = G.you.pitchers.slice(0, 13).map((p, i) => ({ ...p, _origIdx: i }));

            const { col, dir } = _rosterPitcherSort;
            if (col) {
                rows.sort((a, b) => dir === 'desc' ? b[col] - a[col] : a[col] - b[col]);
            }

            let h = `<div class="section-label" style="margin-bottom:6px">Pitchers</div>`;
            h += `<div style="overflow-x:auto">`;
            h += `<table class="roster-table">`;
            h += `<thead><tr>
    <th style="min-width:46px">Role</th>
    <th style="min-width:110px">Name</th>
    <th style="width:28px"></th>
    <th class="sortable" style="text-align:right;min-width:62px">ERA ${pSortIcon('era')}</th>
    <th class="sortable" style="text-align:right;min-width:68px">WHIP ${pSortIcon('whip')}</th>
    <th class="sortable" style="text-align:right;min-width:56px">K% ${pSortIcon('kRate')}</th>
    <th class="sortable" style="text-align:right;min-width:60px">BB% ${pSortIcon('bbRate')}</th>
    <th style="text-align:right;min-width:52px">Hand</th>
  </tr></thead>`;
            h += `<tbody>`;

            rows.forEach(p => {
                const fp = p.isFP;
                const eraChip = p.era < 3.0 ? 'chip-green' : p.era < 4.5 ? 'chip-gray' : 'chip-red';
                const whipChip = p.whip < 1.00 ? 'chip-green' : p.whip < 1.30 ? 'chip-gray' : 'chip-red';
                const kChip = p.kRate >= .28 ? 'chip-green' : p.kRate >= .18 ? 'chip-gray' : 'chip-amber';
                const bbChip = p.bbRate <= .08 ? 'chip-green' : p.bbRate <= .14 ? 'chip-gray' : 'chip-red';

                h += `<tr class="${fp ? 'fp-row' : ''}">
      <td><span class="chip ${p.isStarter ? 'chip-amber' : 'chip-blue'}" style="font-size:9px">${p.role}</span></td>
      <td class="name-cell">${fp ? `<span style="color:var(--purple0);margin-right:2px">★</span>` : ''}${p.name}</td>
      <td style="white-space:nowrap">${fp ? '<span class="chip chip-purple" style="font-size:9px">★FP</span>' : ''}</td>
      <td class="stat-cell"><span class="chip ${eraChip}" style="font-size:9px">${p.era.toFixed(2)}</span></td>
      <td class="stat-cell"><span class="chip ${whipChip}" style="font-size:9px">${p.whip.toFixed(2)}</span></td>
      <td class="stat-cell"><span class="chip ${kChip}" style="font-size:9px">${Math.round(p.kRate * 100)}%</span></td>
      <td class="stat-cell"><span class="chip ${bbChip}" style="font-size:9px">${Math.round(p.bbRate * 100)}%</span></td>
      <td style="text-align:right"><span class="chip chip-gray" style="font-size:9px">${p.hand}HP</span></td>
    </tr>`;
            });

            h += `</tbody></table></div>`;
            el.innerHTML = h;
        }

        // ══ MAIN RENDER ══════════════════════════════════════════════════════════
        function renderOffseasonRoster() {
            renderOffseasonRosterHitters();
            renderOffseasonRosterPitchers();
        }

        // Init
        renderFOBadges();
        renderOffseasonRoster();
    </script>
</body>

</html>
